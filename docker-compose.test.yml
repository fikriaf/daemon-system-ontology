version: '3.8'
services:
  postgres-test:
    image: apache/age:latest
    environment:
      POSTGRES_USER: daemon
      POSTGRES_PASSWORD: daemon_test
      POSTGRES_DB: daemon_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daemon -d daemon_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
